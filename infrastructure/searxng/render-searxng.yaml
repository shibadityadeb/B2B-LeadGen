# Render Blueprint for the search service.
#
#   Render → New → Blueprint → this repository → pick this file.
#   Or: New → Web Service → Docker → root directory infrastructure/searxng
#
# Then point the API at it:
#   SEARCH_PROVIDER = searxng
#   SEARXNG_URL     = https://<this-service>.onrender.com
#
# It is built from a Dockerfile rather than run from the official image
# directly, because SearXNG ships with JSON output disabled and the backend
# needs it.

services:
  - type: web
    name: ubm-searxng
    runtime: docker
    rootDir: infrastructure/searxng
    dockerfilePath: ./Dockerfile
    region: singapore # keep it near the API
    plan: free # see the note on cold starts in README → Deploying
    healthCheckPath: /healthz

    envVars:
      - key: SEARXNG_SECRET
        generateValue: true # Render generates and stores it
      - key: SEARXNG_BASE_URL
        sync: false # https://<this-service>.onrender.com/
      - key: UWSGI_WORKERS
        value: "2"
      - key: UWSGI_THREADS
        value: "2"
